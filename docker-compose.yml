services:
  mongo:
    image: mongo
    restart: always
    volumes:
      - /data/db:/data/db
    logging:
      options:
        max-size: '10m'
        max-file: '2'

  api:
    build:
      dockerfile: Dockerfile.api
    restart: always
    env_file: api/.env.production
    depends_on:
      - mongo
    volumes:
      - /data/storage:/data/storage
    healthcheck:
      test: wget -qO- http://localhost:3000/api/describe || exit 1
      timeout: 5s
      interval: 10s

  web:
    build:
      dockerfile: Dockerfile.web
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - web-build:/var/www/html

  nginx:
    build:
      context: nginx
    restart: always
    depends_on:
      - api
      - web
    ports:
      - 80:80
    volumes:
      - web-build:/var/www/html
    logging:
      options:
        max-size: '2G'
        max-file: '4'

volumes:
  web-build:

